<!DOCTYPE html>
<html>
<head>
    <title>Staff Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>STAFF REGISTRATION</h2>

    <input type="text" id="name" placeholder="Name">

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <label style="
        display:flex;
        justify-content:flex-start;
        align-items:baseline;
        gap:0px;
        margin-top:0px;
        font-size:15px;
        width:10%;
        white-space:nowrap;
    ">
        <input type="checkbox" onclick="togglePassword()">
        Show Password
    </label>

    <input type="password" id="confirmPassword" placeholder="Verify Password">

    <label style="
        display:flex;
        justify-content:flex-start;
        align-items:baseline;
        gap:0px;
        margin-top:0px;
        font-size:15px;
        width:10%;
        white-space:nowrap;
    ">
        <input type="checkbox" onclick="toggleConfirmPassword()">
        Show Confirm Password
    </label>

    <button onclick="register()">Register</button>
    <p id="message" style="min-height:20px;font-size:14px;"></p>

    <p>
        Already have account?
        <a href="index.html">Login</a>
    </p>

</div>

<script type="module">

import { auth, database } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { ref, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

window.register = async function(){

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const messageEl = document.getElementById('message');

    if(!name || !email || !password || !confirmPassword){
        messageEl.textContent = "Please fill in all fields";
        messageEl.style.color = "#b00020";
        return;
    }

    if(password !== confirmPassword){
        messageEl.textContent = "Passwords do not match";
        messageEl.style.color = "#b00020";
        return;
    }

    try{
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await set(ref(database, 'users/' + user.uid), {
            name: name,
            email: email,
            role: "staff",
            setupComplete: false,
            employeeId: "",
            fingerprintEnrolled: false
        });

        messageEl.textContent = "Registration Complete";
        messageEl.style.color = "#0a7a3d";

        setTimeout(() => {
            window.location = "index.html";
        }, 1200);

    }catch(error){
        messageEl.textContent = error.message;
        messageEl.style.color = "#b00020";
    }

}

window.togglePassword = function(){
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
};

window.toggleConfirmPassword = function(){
    const pass = document.getElementById("confirmPassword");
    pass.type = pass.type === "password" ? "text" : "password";
};

</script>

</body>
</html>
