<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>BREWSPOT DTR SYSTEM</h2>

    <input type="text" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

<label style="
    display:flex;
    justify-content:flex-start;
    align-items:baseline;
    gap:0px;
    margin-top:0px;
    font-size:15px;
    width:10%;
    white-space:nowrap;

">
    <input type="checkbox" onclick="togglePassword()">
    Show Password
</label>

    <button onclick="login()">Login</button>

    <p>
        No account?
        <a href="register.html">Register</a>
    </p>

</div>

<script type="module">

import { auth, database } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

window.login = async function(){

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if(!email || !password){
        alert("Please enter email and password");
        return;
    }

    if(email === "Administrator" && password === "Password"){
        localStorage.setItem("role","admin");
        window.location = "admin.html";
        return;
    }

    try{
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const userRef = ref(database, 'users/' + user.uid);
        const userSnapshot = await get(userRef);
        const userData = userSnapshot.val() || {};

        localStorage.setItem("role", userData.role || "staff");

        if(userData.setupComplete === true){
            window.location = "dashboard.html";
            return;
        }

        window.location = "secondary-registration.html";

    }catch(error){
        alert(error.message);
    }
};

window.togglePassword = function(){
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
};

</script>

</body>
</html>
